schema_version = "1.3"

# Harbor 0.20 separate verifier containers do not share the agent filesystem.
# Collect only the candidate workspace and rematerialize it in the clean
# verifier environment. Git history and build caches are not grading evidence.
artifacts = [
  { source = "/app", exclude = [".git", "__pycache__", "*.pyc", ".pytest_cache"] }
]

[task]
name = "ai-infra-bench/vllm-mm-encoder-cache-compaction"
description = "Separate decoder placeholder coordinates from compact multimodal encoder-cache accounting and storage."
authors = [{ name = "AI Infra Benchmark Authors" }]
keywords = ["ai-inference", "vllm", "refactor", "multimodal", "scheduler", "memory-kv"]

[metadata]
benchmark_schema_version = "0.1"
source_ids = ["vllm__pr__30475", "vllm__issue__25903"]
track = "memorable"
workload_type = "refactor"
subsystems = ["scheduler", "memory_kv", "distributed", "model"]
difficulty = "expert"
repository = "vllm-project/vllm"
base_commit = "676db55eecf8b6d9ec38ea243cf6f35ea8378ec6"
source_cutoff = "2026-08-08"
accelerator_vendor = "nvidia"
accelerator_type = "A100-SXM4-40GB"
accelerator_count = 1
checkpoint_digests = []
# Intentionally unresolved: the validated local Docker image ID is not an OCI
# RepoDigest and must not be presented as a portable release identity.
image_digest = ""
grader_kind = "correctness"

[agent]
timeout_sec = 7200.0
network_mode = "no-network"
user = "agent"

[verifier]
timeout_sec = 2400.0
network_mode = "no-network"
environment_mode = "separate"
user = "agent"

[environment]
network_mode = "no-network"
build_timeout_sec = 7200.0
os = "linux"
workdir = "/app"
cpus = 16
memory_mb = 65536
storage_mb = 102400
gpus = 1
gpu_types = ["A100"]
