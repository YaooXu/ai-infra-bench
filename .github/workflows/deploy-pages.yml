name: Publish website to root GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - tasks/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      GITHUB_PAGES: 'true'
      GITHUB_PAGES_BASE_PATH: ''
      NEXT_PUBLIC_SITE_URL: https://ai-infra-bench.github.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build:pages
      - name: Publish generated site
        env:
          GH_TOKEN: ${{ secrets.ROOT_PAGES_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh auth setup-git
          cd dist/client
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin https://github.com/ai-infra-bench/ai-infra-bench.github.io.git
          git push --force origin main
